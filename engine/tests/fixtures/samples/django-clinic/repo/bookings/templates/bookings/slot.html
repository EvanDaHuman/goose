{% extends "bookings/base.html" %}
{% block content %}
<h1>{{ slot.clinician.name }}, {{ slot.starts_at|date:"l j F" }} at {{ slot.starts_at|time:"H:i" }}</h1>
<p>{{ slot.clinician.specialty }}, {{ slot.minutes }} minutes.</p>
<form method="post" action="/slots/{{ slot.id }}/">{% csrf_token %}
{{ form.as_p }}
<button type="submit">Book this time</button>
</form>
{% endblock %}
